<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Jam</title>
    <style type="text/css">
        #container > div {
            width: 50px;
            height: 50px;
            border: 1px solid black;
            margin-bottom: 5px;
            border-radius: 50%;
            
            cursor: url('cursor.svg') 3 3, pointer;
        }
        #container {
            float: left;
            margin-right: 10px;
            border: 1px solid black;
            padding: 2px;
            border-radius: 10px;
        }

    </style>
</head>
<body>

    <div id="container">
        <div data-color="red"></div>
        <div data-color="yellow"></div>
        <div data-color="green"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
